
<!DOCTYPE html>
<html>
<body>
  <canvas id="canvas" width="2500" height="1686"></canvas>
  <script>
    async function convert(src, name) {
      const img = new Image();
      img.src = src;
      await new Promise(r => img.onload = r);
      const ctx = document.getElementById('canvas').getContext('2d');
      ctx.drawImage(img, 0, 0, 2500, 1686);
      const data = document.getElementById('canvas').toDataURL('image/jpeg', 0.85);
      console.log('---START ' + name + '---');
      console.log(data);
      console.log('---END ' + name + '---');
    }
    
    // We will call this from the browser agent
  </script>
</body>
</html>
