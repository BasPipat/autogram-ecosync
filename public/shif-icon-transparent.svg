<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Glowing neon-green tube gradient -->
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9EFF00" />
      <stop offset="100%" stop-color="#5AD100" />
    </linearGradient>

    <!-- Volumetric green neon glow filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.55" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- S Icon -->
  <g transform="translate(10, 10) scale(0.8)">
    <path d="M 140,40 C 75,40 45,42 45,86 C 45,130 140,112 140,156 C 140,200 110,202 45,202" 
          fill="none" 
          stroke="url(#neonGreenGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neonGlow)" />
    <path d="M 140,40 C 75,40 45,42 45,86 C 45,130 140,112 140,156 C 140,200 110,202 45,202" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.8" />
  </g>
</svg>
