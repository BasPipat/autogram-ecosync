<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Hex-tech Cyber Green Gradient -->
    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39FF14" />
      <stop offset="100%" stop-color="#00DF89" />
    </linearGradient>
    
    <!-- Clean Slate Steel Gradient -->
    <linearGradient id="slateSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Dark presentation background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>

    <!-- Glow effect for hexagonal paths -->
    <filter id="hexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />

  <!-- Clean Grid -->
  <g opacity="0.03" stroke="#FFFFFF" stroke-width="1">
    <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300" />
    <path d="M 200,0 L 200,400 M 400,0 L 400,400 M 600,0 L 600,400" />
  </g>

  <!-- Logo Group -->
  <g>
    <!-- ================= S (Hex-Loop) ================= -->
    <!-- Stylized 45-degree angle open path representing clean-tech circuit loop -->
    <path d="M 255,172 L 210,172 L 195,187 L 195,200 L 255,200 L 255,213 L 240,228 L 195,228" 
          fill="none" 
          stroke="url(#cyberGreen)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#hexGlow)" />

    <!-- ================= H (Split Tech Column) ================= -->
    <!-- Modern tech split columns with clean industrial gap -->
    <path d="M 309,130 L 337,130 L 337,270 L 309,270 Z" fill="url(#slateSteel)" />
    <path d="M 381,130 L 409,130 L 409,270 L 381,270 Z" fill="url(#slateSteel)" />
    <!-- Segmented crossbars -->
    <path d="M 337,186 L 354,186 L 354,214 L 337,214 Z" fill="url(#slateSteel)" />
    <path d="M 364,186 L 381,186 L 381,214 L 364,214 Z" fill="url(#slateSteel)" />

    <!-- ================= I (Intelligent Pillar & Hex-Pin) ================= -->
    <!-- Minimalist clean tracking stem -->
    <path d="M 458,186 L 486,186 L 486,270 L 458,270 Z" fill="url(#slateSteel)" />
    <!-- Stylized Hexagonal location pin -->
    <path d="M 472,168 L 454,150 L 454,130 L 472,120 L 490,130 L 490,150 Z M 472,135 A 5,5 0 1,0 472,145 A 5,5 0 1,0 472,135 Z" 
          fill="url(#cyberGreen)" 
          fill-rule="evenodd" 
          filter="url(#hexGlow)" />

    <!-- ================= F (Parallel Aerodynamic Bars) ================= -->
    <!-- F - Clean technical layout with parallel speed cuts -->
    <path d="M 530,130 L 558,130 L 558,270 L 530,270 Z" fill="url(#slateSteel)" />
    <path d="M 564,130 L 630,130 L 630,158 L 564,158 Z" fill="url(#slateSteel)" />
    <path d="M 564,186 L 610,186 L 610,214 L 564,214 Z" fill="url(#slateSteel)" />
  </g>

  <!-- Tagline / Subtitle -->
  <text x="400" y="335" 
        fill="#718096" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-size="11" 
        font-weight="700" 
        letter-spacing="12" 
        text-anchor="middle">INTELLIGENT FLEET NETWORK</text>
</svg>
