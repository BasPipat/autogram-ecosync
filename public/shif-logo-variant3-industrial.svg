<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Vibrant Eco-Green Gradient for high-performance visual impact -->
    <linearGradient id="performanceGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00C456" />
    </linearGradient>
    
    <!-- Bold Metallic Charcoal/Iron Gradient -->
    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Dark Industrial Slate Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090B0E" />
      <stop offset="100%" stop-color="#141820" />
    </linearGradient>

    <!-- Performance glow for speed elements -->
    <filter id="speedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.45" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Heavy drop shadow under the heavy-duty letters -->
    <filter id="heavyShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="-4" dy="10" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />

  <!-- Speed lines in background (Dynamic velocity lines) -->
  <g opacity="0.03" stroke="#FFFFFF" stroke-width="2">
    <line x1="-100" y1="50" x2="900" y2="50" />
    <line x1="-100" y1="120" x2="900" y2="120" />
    <line x1="-100" y1="190" x2="900" y2="190" />
    <line x1="-100" y1="260" x2="900" y2="260" />
    <line x1="-100" y1="330" x2="900" y2="330" />
  </g>

  <!-- Slanted Logo Group (Skewed at -8 degrees for high velocity expression) -->
  <g transform="skewX(-8) translate(30, 0)" filter="url(#heavyShadow)">
    
    <!-- ================= S (Industrial Speed-Slice) ================= -->
    <!-- Solid blocky S with sliced technical gaps representing forward speed -->
    <path d="M 195,172 L 255,172 L 255,196 L 217,196 L 217,204 L 255,204 L 255,228 L 195,228 L 195,204 L 233,204 L 233,196 L 195,196 Z" 
          fill="url(#performanceGreen)" 
          filter="url(#speedGlow)" />

    <!-- ================= H (Heavy Truss Column) ================= -->
    <!-- Slanted, beveled industrial truss structures -->
    <path d="M 309,138 L 337,130 L 337,185 L 381,185 L 381,130 L 409,138 L 409,262 L 381,270 L 381,215 L 337,215 L 337,270 L 309,262 Z" 
          fill="url(#ironGrad)" />

    <!-- ================= I (Intelligent Beveled Spear) ================= -->
    <!-- Pointy-bottom stem -->
    <path d="M 458,194 L 486,186 L 486,270 L 458,262 Z" fill="url(#ironGrad)" />
    <!-- Sharp Diamond Location GPS Pin -->
    <path d="M 472,168 L 454,144 L 472,120 L 490,144 Z M 472,136 L 464,144 L 472,152 L 480,144 Z" 
          fill="url(#performanceGreen)" 
          fill-rule="evenodd" 
          filter="url(#speedGlow)" />

    <!-- ================= F (Razor Speed Fins) ================= -->
    <!-- Top-chamfered stem with arrow-head horizontal bars -->
    <path d="M 530,138 L 558,130 L 558,185 L 610,185 L 595,213 L 558,213 L 558,270 L 530,262 Z" fill="url(#ironGrad)" />
    <path d="M 558,130 L 630,130 L 610,158 L 558,158 Z" fill="url(#ironGrad)" />
  </g>

  <!-- Tagline / Brand Subtitle -->
  <text x="400" y="340" 
        fill="#4A5568" 
        font-family="'Orbitron', 'Impact', sans-serif" 
        font-size="13" 
        font-weight="900" 
        letter-spacing="14" 
        text-anchor="middle">HEAVY-DUTY TRUCKING SOLUTIONS</text>
</svg>
